name: Publish prepared source bundle

on:
  push:
    paths:
      - ".publish/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild prepared source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/part-* > /tmp/bundle.b64
          base64 -d /tmp/bundle.b64 > /tmp/bundle.zip
          unzip -t /tmp/bundle.zip
          unzip -oq /tmp/bundle.zip -d .
          rm -rf .publish
          rm -f .github/workflows/publish_bundle.yml

      - name: Commit published project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish UAV Vision Detection & Tracking source and screenshots"
          git push origin HEAD:main
