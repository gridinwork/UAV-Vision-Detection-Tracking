name: Publish prepared source bundle

on:
  push:
    paths:
      - ".publish/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack prepared source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t .publish/source.zip
          unzip -oq .publish/source.zip -d .
          rm -rf .publish
          rm -f .github/workflows/publish_bundle.yml

      - name: Commit published project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish UAV Vision Detection & Tracking"
          git push origin HEAD:main
